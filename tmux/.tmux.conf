# Set the default terminal type to 256color for proper color support
set -g default-terminal "tmux-256color"

# Enable RGB color support for xterm-compatible terminals
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-features ",xterm-kitty:RGB,hyperlinks"

# Set the prefix key to Alt + a (M-a)
set -g prefix M-a

# Unbind the default Ctrl + b prefix
unbind C-b

# Allow sending the prefix key to applications within tmux by pressing it twice
bind-key M-a send-prefix

# Unbind the default vertical split key (%)
unbind %

# Bind | to split the window horizontally (side-by-side)
bind | split-window -h 

# Unbind the default horizontal split key (")
unbind '"'

# Bind - to split the window vertically (top-and-bottom)
bind - split-window -v

# Unbind the default reload key (r)
unbind r

# Bind r to reload the tmux configuration file and display a message
bind r source-file ~/.tmux.conf

# Bind j, k, l, h to resize panes in 5-unit increments (Down, Up, Right, Left)
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

# Bind m to toggle pane maximization (zoom)
bind -r m resize-pane -Z

# Bind Alt + c to create a new session in the current pane's directory
bind M-c attach-session -c "#{pane_current_path}"

# Enable mouse support for selecting panes, resizing, and scrolling
set -g mouse on

# Forward tmux copies to the terminal clipboard when supported
set -s set-clipboard on

# Allow OSC 8 hyperlinks and similar terminal escape sequences through to kitty.
set -g allow-passthrough on

# Use Vi-style keybindings in copy mode
set-window-option -g mode-keys vi

# In copy mode, use 'v' to begin text selection
bind-key -T copy-mode-vi 'v' send -X begin-selection

# In copy mode, use 'y' to copy the selected text to the buffer
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Don't exit copy mode when the mouse drag ends
unbind -T copy-mode-vi MouseDragEnd1Pane

# Set the escape time to 10ms to avoid delays when exiting insert mode in Neovim
set -sg escape-time 10

# Bind x to kill the current pane without confirmation
bind x kill-pane

# Bind q to kill the current window without confirmation
bind q kill-window

# --- TPM (Tmux Plugin Manager) Configuration ---

# Add the Tmux Plugin Manager (tpm) as a plugin
set -g @plugin 'tmux-plugins/tpm'

# Plugin: Seamless navigation between Vim/Neovim and tmux panes (Manual Alt+hjkl bindings)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R

# Plugin: Tokyo Night theme for tmux
set -g @plugin 'fabioluciano/tmux-tokyo-night'

# Plugin: Restore tmux environment after system restart
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Plugin: Continuous saving of tmux environment every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable capturing pane contents for resurrection
set -g @resurrect-capture-pane-contents 'on'

# Automatically restore the last saved environment on tmux start
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (this line must remain at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
